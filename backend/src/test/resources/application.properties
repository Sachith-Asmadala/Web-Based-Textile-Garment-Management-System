spring.datasource.url=jdbc:h2:mem:tgms;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

tgms.client-origin=http://localhost:5173
tgms.auth.jwt-secret=test-only-secret-must-be-at-least-32-bytes-long
tgms.auth.issuer=tgms-api
tgms.auth.session-hours=8
tgms.auth.cookie-secure=false
